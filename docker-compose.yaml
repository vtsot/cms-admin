services:
    php-fpm:
        build:
            context: ./.docker/php-fpm
            args:
                PHP_VERSION: ${PHP_VERSION:-8.4}
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        restart: unless-stopped
        extra_hosts:
            - "cms.vacancy-grabber.local:host-gateway"
        volumes:
            - ./:/var/www/html:rw
        networks:
            - vacancy-grabber-cms
            - shared-smtp
#        depends_on:
#            - redis

    nodejs:
        build: ./.docker/nodejs
        restart: unless-stopped
        volumes_from:
            - php-fpm
        depends_on:
            - php-fpm
        ports:
            - "8888:8888"

    nginx:
        build: ./.docker/nginx
        restart: unless-stopped
        volumes_from:
            - php-fpm
        networks:
            reverse-proxy:
            vacancy-grabber-cms:
                aliases:
                    - cms.vacancy-grabber.local
        expose:
            - "80"
        environment:
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=cms.vacancy-grabber.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=vacancy-grabber.local
        depends_on:
            - php-fpm

    mysql:
        build: ./.docker/mysql
        restart: unless-stopped
        environment:
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
            - MYSQL_DATABASE=vacancy_grabber_cms
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_ALLOW_EMPTY_PASSWORD=true
        volumes:
            - ./.docker/mysql/data:/var/lib/mysql
        networks:
            - vacancy-grabber-cms
        ports:
            - "3306:3306"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: unless-stopped
        volumes:
            - ./.docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
        networks:
            - reverse-proxy
            - vacancy-grabber-cms
        expose:
            - "80"
        environment:
            - UPLOAD_LIMIT=300M
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=webmysql.cms.vacancy-grabber.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=vacancy-grabber.local

    adminer:
        image: adminer
        restart: unless-stopped
        networks:
            - reverse-proxy
            - vacancy-grabber-cms
        expose:
            - "8080"
        environment:
            - VIRTUAL_PORT=8080
            - VIRTUAL_HOST=adminer.cms.vacancy-grabber.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=vacancy-grabber.local


