services:
    php-fpm:
        build:
            context: ./.docker/php-fpm
            args:
                PHP_VERSION: ${COMPOSE_PHP_VERSION:-8.4}
                USER_ID: ${COMPOSE_USER_ID:-1000}
                GROUP_ID: ${COMPOSE_GROUP_ID:-1000}
        restart: unless-stopped
        extra_hosts:
            - "cms-admin.local:host-gateway"
            - "admin.cms-admin.local:host-gateway"
        volumes:
            - ./:/var/www/html:rw
        networks:
            - cms-admin_app
            - shared-smtp

    nodejs:
        build: ./.docker/nodejs
        restart: unless-stopped
        volumes_from:
            - php-fpm
        depends_on:
            - php-fpm
        ports:
            - "8888:8888"

    nginx:
        build: ./.docker/nginx
        restart: unless-stopped
        volumes_from:
            - php-fpm
        networks:
            reverse-proxy:
            cms-admin_app:
                aliases:
                    - cms-admin.local
                    - admin.cms-admin.local
        expose:
            - "80"
        environment:
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=cms-admin.local,admin.cms-admin.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=cms-admin.local
        depends_on:
            - php-fpm

    mysql:
        build: ./.docker/mysql
        restart: unless-stopped
        environment:
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
            - MYSQL_DATABASE=cms_admin
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_ALLOW_EMPTY_PASSWORD=true
        volumes:
            - ./.docker/mysql/data:/var/lib/mysql
        networks:
            - cms-admin_app

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: unless-stopped
        volumes:
            - ./.docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
        networks:
            - reverse-proxy
            - cms-admin_app
        expose:
            - "80"
        environment:
            - UPLOAD_LIMIT=300M
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=webmysql.cms-admin.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=cms-admin.local

    adminer:
        image: adminer
        restart: unless-stopped
        networks:
            - reverse-proxy
            - cms-admin_app
        expose:
            - "8080"
        environment:
            - VIRTUAL_PORT=8080
            - VIRTUAL_HOST=adminer.cms-admin.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=cms-admin.local

networks:
    reverse-proxy:
        name: reverse-proxy
        external: true
    shared-smtp:
        name: shared-smtp
        external: true
    cms-admin_app:
        driver: bridge
