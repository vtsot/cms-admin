fm_elfinder:
    instances:
        default:
            editor: 'ckeditor'
            fullscreen: true
            theme: 'base' # jquery theme, default is 'smoothness'
            relative_path: true
            connector:
                debug: '%kernel.debug%'
                roots:
                    uploads:
                        show_hidden: false
                        url: '/uploaded'
                        driver: 'LocalFileSystem'
                        path: 'uploaded'
                        upload_allow: ['image/png', 'image/jpg', 'image/jpeg', 'image/gif', 'video/mp4', 'application/pdf']
                        upload_deny: ['all']
                        upload_max_size: '64M'
                        fileMode: 0666
                        #attributes: example of setting attributes permission
                        #    - { pattern: '/(.*?)/', read: true, write: false, locked: true }
        form:
            editor: 'form'
            fullscreen: true
            theme: 'base'
            relative_path: true
            connector:
                debug: '%kernel.debug%'
                roots:
                    uploads:
                        show_hidden: false
                        url: '/uploaded'
                        driver: 'LocalFileSystem'
                        path: 'uploaded'
                        upload_allow: ['image/png', 'image/jpg', 'image/jpeg']
                        upload_deny: ['all']
                        upload_max_size: '64M'
                        fileMode: 0666
