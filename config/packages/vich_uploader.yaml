vich_uploader:
    db_driver: orm
    storage:   flysystem

    metadata:
        type: attribute

    mappings:
        gallery:
            upload_destination: gallery.image.storage
            directory_namer:
                service: Vich\UploaderBundle\Naming\SubdirDirectoryNamer
                options: { property: 'id', chars_per_dir: 2, dirs: 3 }
            namer:
                service: vich_uploader.namer_property
                options: { property: 'id' }
            inject_on_load: true # true is required
            delete_on_update: true
            delete_on_remove: true

        banner:
            upload_destination: banner.image.storage
            directory_namer:
                service: Vich\UploaderBundle\Naming\SubdirDirectoryNamer
                options: { property: 'id', chars_per_dir: 2, dirs: 3 }
            namer:
                service: App\Service\UploaderUuidNamer
                options: { property: 'id' }
            inject_on_load: true # true is required
            delete_on_update: true
            delete_on_remove: true

        article:
            upload_destination: article.image.storage
            directory_namer:
                service: Vich\UploaderBundle\Naming\SubdirDirectoryNamer
                options: { property: 'id', chars_per_dir: 2, dirs: 3 }
            namer:
                service: vich_uploader.namer_property
                options: { property: 'id' }
            inject_on_load: true # true is required
            delete_on_update: true
            delete_on_remove: true

        site:
            upload_destination: site.image.storage
            directory_namer:
                service: Vich\UploaderBundle\Naming\SubdirDirectoryNamer
                options: { property: 'id', chars_per_dir: 2, dirs: 3 }
            namer:
                service: App\Service\UploaderUuidNamer
                options: { property: 'id' }
            inject_on_load: true # true is required
            delete_on_update: true
            delete_on_remove: true
