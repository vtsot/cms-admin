# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        default.storage:
            adapter: 'local'
            public_url: '%kernel.project_dir%/var/storage/default'
            options: { directory: '%kernel.project_dir%/var/storage/default' }

        tmp.storage:
            adapter: 'local'
            public_url: '%kernel.project_dir%/var/storage/tmp'
            options: { directory: '%kernel.project_dir%/var/storage/tmp' }
            visibility: 'public'


#        gallery.image.storage:
#            adapter: 'local'
#            options:
#                directory: '%storage_dir%/images/gallery'
#        gallery.image.cache.storage:
#            adapter: 'local'
#            options:
#                directory: '%storage_cache_dir%/images/gallery'

        banner.image.storage:
            adapter: 'local'
            public_url: '%banner_image_storage_dir%'
            options: { directory: '%banner_image_storage_dir%'}
        banner.image.cache.storage:
            adapter: 'local'
            public_url: '%banner_image_cache_storage_dir%'
            options: { directory: '%banner_image_cache_storage_dir%' }

        article.image.storage:
            adapter: 'local'
            public_url: '%article_image_storage_dir%'
            options:
                directory: '%article_image_storage_dir%'
        article.image.cache.storage:
            adapter: 'local'
            public_url: '%article_image_cache_storage_dir%'
            options:
                directory: '%article_image_cache_storage_dir%'

        site.image.storage:
            adapter: 'local'
            public_url: '%site_image_storage_dir%'
            options: { directory: '%site_image_storage_dir%' }

        site.image.cache.storage:
            adapter: 'local'
            public_url: '%site_image_cache_storage_dir%'
            options: { directory: '%site_image_cache_storage_dir%' }
