security:
    role_hierarchy:
        ROLE_USER:
            - IS_AUTHENTICATED_FULLY
            - IS_AUTHENTICATED_REMEMBERED

        ROLE_API_SITE:
            - ROLE_USER

        ROLE_SITE_MANAGER:
            - ROLE_USER
            - ROLE_ADMIN_SITE_LIST
            - ROLE_ADMIN_SITE_EDIT
            - ROLE_ADMIN_SITE_NAVIGATION_MAIN_ALL
            - ROLE_ADMIN_SITE_NAVIGATION_MAIN_CHILDREN_ALL
            - ROLE_ADMIN_SITE_PAGE_ALL
            - ROLE_ADMIN_SITE_PAGE_ARTICLE_RELATED_ALL
            - ROLE_ADMIN_SITE_PAGE_ARTICLE_RELATED_INLINE_ALL
            - ROLE_ADMIN_SITE_ARTICLE_ALL
            - ROLE_ADMIN_SITE_BANNER_ALL
            - ROLE_ADMIN_SITE_CONTACT_ALL
            - ROLE_ADMIN_SYSTEM_LOG_ALL
            - ROLE_ADMIN_SYSTEM_CONTACT_ALL

        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_SITE_MANAGER
            - ROLE_ADMIN_SITE_ALL
            - ROLE_ADMIN_SITE_SETTINGS_ALL
            - ROLE_ADMIN_SITE_SETTINGS_INLINE_ALL
            - ROLE_ADMIN_SITE_NAVIGATION_MAIN_ALL
            - ROLE_ADMIN_SITE_NAVIGATION_MAIN_CHILDREN_ALL
            - ROLE_ADMIN_SITE_PAGE_ALL
            - ROLE_ADMIN_SITE_PAGE_ARTICLE_RELATED_ALL
            - ROLE_ADMIN_SITE_PAGE_ARTICLE_RELATED_INLINE_ALL
            - ROLE_ADMIN_SITE_ARTICLE_ALL
            - ROLE_ADMIN_SITE_BANNER_ALL
            - ROLE_ADMIN_SITE_CONTACT_ALL
            - ROLE_ADMIN_USER_ALL_ALL # autocomplete in edit/folters
            #- ROLE_ADMIN_USER_SUPERVISOR_ALL
            - ROLE_ADMIN_USER_ADMIN_ALL
            - ROLE_ADMIN_USER_SITE_MANAGER_ALL
            - ROLE_ADMIN_USER_REGULAR_ALL

        ROLE_SUPERVISOR:
            - ROLE_ADMIN
            - ROLE_ALLOWED_TO_SWITCH
            - ROLE_ADMIN_USER_SUPERVISOR_ALL

    providers:
        api_doc_users:
            memory:
                users:
                    apidoc_user: { password: '92hkif90ln', roles: [ ROLE_API_DOC ] }

        api_site_users:
            lexik_jwt:
                class: App\Security\User\ApiSiteUser

        api_site_token_user_provider:
            id: App\Security\UserProvider\ApiSiteTokenUserProvider

        regular_user_provider:
            id: App\Security\UserProvider\RegularUserProvider

    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser:
            algorithm: 'plaintext'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'auto'

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_doc:
            pattern: ^/doc$
            host: '^%api_domain%$'
            http_basic:
                provider: api_doc_users
                realm: Basic

        api_site:
            pattern: '^/sites'
            host: '^%api_domain%$'
            lazy: true
            stateless: true
            provider: api_site_token_user_provider
            entry_point: jwt
            login_throttling:
                limiter: app.api_site_login_rate_limiter

            custom_authenticators:
                - App\Security\Authentication\ApiSiteLoginAuthenticator

            json_login:
                check_path: api.site.auth.login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            refresh_jwt:
                check_path: api.site.auth.refresh_token
                provider: api_site_token_user_provider

        admin:
            pattern: ^/
            host: '^%admin_domain%$'
            lazy: true
            provider: regular_user_provider
            login_throttling:
                limiter: app.admin_login_rate_limiter

            form_login:
                login_path: admin.login
                check_path: admin.login_check
                default_target_path: sonata_admin_dashboard

            logout:
                path: admin.logout
                target: admin.login

            entry_point: form_login

        main:
            pattern: ^/
            lazy: true
            provider: regular_user_provider
            user_checker: App\Security\UserChecker

            logout:
                path: admin.logout
                target: web.homepage


    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: '^/(css|js|images|assets|favicon\.ico)', roles: PUBLIC_ACCESS }
        # allow unauthenticated users to access the login form
        - { host: '^%api_domain%$', path: '^/doc$', roles: ROLE_API_DOC }
        - { host: '^%api_domain%$', path: '^/sites/auth/(login|refresh-token)', roles: PUBLIC_ACCESS }
        - { host: '^%api_domain%$', path: '^/sites', roles: ROLE_API_SITE }
        - { host: '^%admin_domain%$', path: '^/login', roles: PUBLIC_ACCESS }
        - { host: '^%admin_domain%$', path: '^/', roles: [ROLE_SITE_MANAGER] }
        - { path: '^/', roles: PUBLIC_ACCESS }


when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
