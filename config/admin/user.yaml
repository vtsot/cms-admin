services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    # show_in_dashboard = false
    # do not display, it used as autocomplete
    admin.user.all:
        class: 'App\Admin\User\AllUserAdmin'
        calls:
            - [ setBaseRouteName,       ['admin.user-all'] ]
            - [ setBaseRoutePattern,    ['user-all'] ]
        tags:
            -   name: sonata.admin
                model_class: 'App\Entity\User'
                manager_type: orm
                group: MENU_GROUP.USER
                label: MENU.USER_ALL
                show_in_dashboard: false

    admin.user.supervisor:
        class: 'App\Admin\User\SupervisorUserAdmin'
        calls:
            - [ setBaseRouteName,       ['admin.user-supervisor'] ]
            - [ setBaseRoutePattern,    ['user-supervisor'] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\User'
              manager_type: orm
              group: MENU_GROUP.USER
              label: MENU.USER_SUPERVISOR

    admin.user.admin:
        class: 'App\Admin\User\AdminUserAdmin'
        calls:
            - [ setBaseRouteName,       ['admin.user-admin'] ]
            - [ setBaseRoutePattern,    ['user-admin'] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\User'
              manager_type: orm
              group: MENU_GROUP.USER
              label: MENU.USER_ADMIN

    admin.user.site_manager:
        class: 'App\Admin\User\SiteManagerUserAdmin'
        calls:
            - [ setBaseRouteName,       ['admin.user-site-manager'] ]
            - [ setBaseRoutePattern,    ['user-site-manager'] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\User'
              manager_type: orm
              group: MENU_GROUP.USER
              label: MENU.USER_SITE_MANAGER

    admin.user.regular:
        class: App\Admin\User\RegularUserAdmin
        calls:
            - [ setBaseRouteName,       ['admin.user_regular'] ]
            - [ setBaseRoutePattern,    ['user-regular'] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\User'
              manager_type: orm
              group: MENU_GROUP.USER
              label: MENU.USER_REGULAR

