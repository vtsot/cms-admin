services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.site:
        class: App\Admin\Site\SiteAdmin
        calls:
            - [ setTemplate,            [ 'edit', 'admin\CRUD\site\edit.html.twig' ] ]
            - [ setBaseRouteName,       [ 'admin.site' ] ]
            - [ setBaseRoutePattern,    [ 'site' ] ]
            - [ addChild,               [ '@admin.site.settings', 'site' ] ]
            - [ addChild,               [ '@admin.site.email_template', 'site' ] ]
            - [ addChild,               [ '@admin.site.navigation_top', 'site' ] ]
            - [ addChild,               [ '@admin.site.navigation_bottom', 'site' ] ]
            - [ addChild,               [ '@admin.site.page', 'site' ] ]
            - [ addChild,               [ '@admin.site.article', 'site' ] ]
            - [ addChild,               [ '@admin.site.gallery_image', 'site' ] ]
            - [ addChild,               [ '@admin.site.faq_group', 'site' ] ]
            - [ addChild,               [ '@admin.site.contact', 'site' ] ]
            - [ addChild,               [ '@admin.site.banner', 'site' ] ]
        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Site\Site'
            controller: 'App\Controller\Admin\Site\SiteCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label: MENU.SITE.LIST
            translation_domain: '%admin_translation_domain%'

    admin.site.theme:
      class: App\Admin\Site\SiteThemeAdmin
      calls:
        - [ setBaseRouteName,       [ 'admin.site.theme' ] ]
        - [ setBaseRoutePattern,    [ 'site-theme' ] ]
      tags:
        - name: sonata.admin
          model_class: 'App\Entity\Site\SiteTheme'
          manager_type: orm
          group: MENU_GROUP.SITE
          label: MENU.SITE.THEME
          show_in_dashboard: false

    admin.site.page:
        class: App\Admin\Site\SitePageAdmin
        calls:
          - [ setBaseRouteName,       [ 'admin.site.page' ] ]
          - [ setBaseRoutePattern,    [ 'site-page' ] ]
          - [ addChild,               [ '@admin.site.page.related_article', 'page' ] ]
        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Page\Page'
            controller: 'App\Controller\Admin\Site\SitePageCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label: MENU.SITE.PAGE.LIST
            show_in_dashboard: false

    admin.site.article:
      class: App\Admin\Site\SiteArticleAdmin
      calls:
        - [ setBaseRouteName,       [ 'admin.site.article' ] ]
        - [ setBaseRoutePattern,    [ 'site-article' ] ]
      tags:
        - name: sonata.admin
          model_class: 'App\Entity\Page\Article'
          controller: 'App\Controller\Admin\Site\SiteArticleCrudController'
          manager_type: orm
          group: MENU_GROUP.SITE
          label: MENU.SITE.ARTICLE
          show_in_dashboard: false

    admin.site.page.related_article:
        class: App\Admin\Site\SitePageRelatedArticleAdmin
        calls:
          - [ setBaseRouteName,       [ 'admin.site.page.related_article' ] ]
          - [ setBaseRoutePattern,    [ 'site-page-related-article' ] ]
        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Page\PageRelatedArticle'
            controller: 'App\Controller\Admin\Site\SitePageRelatedArticleCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label: MENU.SITE.PAGE.RELATED_ARTICLE
            translation_domain: '%admin_translation_domain%'
            show_in_dashboard: false

    admin.site.page.related_article.inline:
      class: App\Admin\Site\SitePageRelatedArticleInlineAdmin
      calls:
        - [ setBaseRouteName,       [ 'admin.site.page.related_article.inline' ] ]
        - [ setBaseRoutePattern,    [ 'site-page-related-article-inline' ] ]
      tags:
        - name: sonata.admin
          model_class: 'App\Entity\Page\PageRelatedArticle'
          controller: 'App\Controller\Admin\Site\SitePageRelatedArticleCrudController'
          manager_type: orm
          group: MENU_GROUP.SITE
          label: MENU.SITE.PAGE.RELATED_ARTICLE
          translation_domain: '%admin_translation_domain%'
          show_in_dashboard: false

    admin.site.navigation_top:
