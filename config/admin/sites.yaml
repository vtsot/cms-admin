services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.site:
        class: 'App\Admin\Site\SiteAdmin'
        calls:
            - [ setTemplate,            [ 'edit', 'admin\CRUD\site\edit.html.twig' ] ]
            - [ setBaseRouteName,       [ 'admin.site' ] ]
            - [ setBaseRoutePattern,    [ 'site' ] ]
            - [ addChild,               [ '@admin.site.settings', 'site' ] ]
            - [ addChild,               [ '@admin.site.navigation.main', 'site' ] ]
            - [ addChild,               [ '@admin.site.page', 'site' ] ]
            - [ addChild,               [ '@admin.site.article', 'site' ] ]
            - [ addChild,               [ '@admin.site.banner', 'site' ] ]
            - [ addChild,               [ '@admin.site.contact', 'site' ] ]

        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Site\Site'
            controller: 'App\Controller\Admin\Site\SiteCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label: MENU.SITE_LIST

    admin.site.settings:
        class: 'App\Admin\Site\SiteSettingsAdmin'
        calls:
            - [ setTemplate,            [ 'edit', 'admin\CRUD\site-settings\edit.html.twig' ] ]
            - [ setBaseRouteName,       [ 'admin.site.settings' ] ]
            - [ setBaseRoutePattern,    [ 'site-settings' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Site\SiteSettings'
              controller: 'App\Controller\Admin\Site\SiteSettingsCrudController'
              manager_type: orm
              group: MENU_GROUP.SITE
              label: MENU.SITE_SETTINGS
              show_in_dashboard: false

    admin.site.settings.inline:
        class: 'App\Admin\Site\SiteSettingsInlineAdmin'
        calls:
            - [ setBaseRouteName,       [ 'admin.site.settings.inline' ] ]
            - [ setBaseRoutePattern,    [ 'site-settings-inline' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Site\SiteSettings'
              controller: 'App\Controller\Admin\Site\SiteSettingsCrudController'
              manager_type: orm
              group: MENU_GROUP.SITE
              label: MENU.SITE.SETTINGS_INLINE
              show_in_dashboard: false

    admin.site.page:
        class: 'App\Admin\Site\Page\PageAdmin'
        calls:
          - [ setBaseRouteName,       [ 'admin.site.page' ] ]
          - [ setBaseRoutePattern,    [ 'site-page' ] ]
          - [ addChild,               [ '@admin.site.page.article.related', 'page' ] ]
        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Page\Page'
            controller: 'App\Controller\Admin\Site\Page\PageCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label: MENU.SITE_PAGE
            show_in_dashboard: false

    admin.site.article:
      class: App\Admin\Site\Page\ArticleAdmin
      calls:
        - [ setBaseRouteName,       [ 'admin.site.article' ] ]
        - [ setBaseRoutePattern,    [ 'site-article' ] ]
      tags:
        - name: sonata.admin
          model_class: 'App\Entity\Page\Article'
          controller: 'App\Controller\Admin\Site\Page\ArticleCrudController'
          manager_type: orm
          group: MENU_GROUP.SITE
          label: MENU.SITE_ARTICLE
          show_in_dashboard: false

    admin.site.page.article.related:
        class: 'App\Admin\Site\Page\ArticleRelatedAdmin'
        calls:
          - [ setBaseRouteName,       [ 'admin.site.page.article.related' ] ]
          - [ setBaseRoutePattern,    [ 'site-page-article-related' ] ]
        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Page\PageRelatedArticle'
            controller: 'App\Controller\Admin\Site\Page\ArticleRelatedCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label: MENU.SITE_PAGE_RELATED_ARTICLE
            show_in_dashboard: false

    admin.site.page.article.related.inline:
      class: 'App\Admin\Site\Page\ArticleRelatedInlineAdmin'
      calls:
        - [ setBaseRouteName,       [ 'admin.site.page.article.related.inline' ] ]
        - [ setBaseRoutePattern,    [ 'site-page-article-related-inline' ] ]
      tags:
        - name: sonata.admin
          model_class: 'App\Entity\Page\PageRelatedArticle'
          controller: 'App\Controller\Admin\Site\Page\ArticleRelatedCrudController'
          manager_type: orm
          group: MENU_GROUP.SITE
          label: MENU.SITE_PAGE_RELATED_ARTICLE
          show_in_dashboard: false

    admin.site.navigation.main:
        class: 'App\Admin\Site\Navigation\MainNavigationSiteAdmin'
        calls:
          - [ setBaseRouteName,       [ 'admin.site.navigation.main' ] ]
          - [ setBaseRoutePattern,    [ 'site-navigation-main' ] ]
          - [ addChildNavigation,     [ '@admin.site.navigation.main.children', 'parent', 'admin.site_admin.site.navigation.main_admin.site.navigation.main.children_list' ] ]
        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Navigation\MainNavigation'
            controller: 'App\Controller\Admin\Site\NavigationSiteCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label:  MENU.SITE_NAVIGATION_MAIN
            show_in_dashboard: false

    admin.site.navigation.main.children:
          class: 'App\Admin\Site\Navigation\ChildrenNavigationSiteAdmin'
          calls:
            - [ setBaseRouteName,       [ 'admin.site.navigation.main.children' ] ]
            - [ setBaseRoutePattern,    [ 'site-navigation-main-children' ] ]
          tags:
            - name: sonata.admin
              model_class: 'App\Entity\Navigation\MainNavigation'
              controller: 'App\Controller\Admin\Site\NavigationSiteCrudController'
              manager_type: orm
              group: MENU_GROUP.SITE
              label: MENU.SITE_NAVIGATION_CHILDREN
              show_in_dashboard: false

    admin.site.banner:
        class: 'App\Admin\Site\BannerAdmin'
        calls:
            - [ setBaseRouteName,       [ 'admin.site.banner' ] ]
            - [ setBaseRoutePattern,    [ 'site-banner' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Site\Banner'
              controller: 'App\Controller\Admin\Site\BannerCrudController'
              manager_type: orm
              group: MENU_GROUP.SITE
              label: MENU.SITE_BANNER
              show_in_dashboard: false

    admin.site.contact:
        class: 'App\Admin\Site\ContactAdmin'
        calls:
            - [ setBaseRouteName,       [ 'admin.site.contact' ] ]
            - [ setBaseRoutePattern,    [ 'site-contact' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Site\Contact'
              controller: 'App\Controller\Admin\Site\ContactCrudController'
              manager_type: orm
              group: MENU_GROUP.SITE
              label: MENU.SITE_CONTACT
              show_in_dashboard: false
