    admin.site.navigation.main:
        class: 'App\Admin\Site\Navigation\MainNavigationSiteAdmin'
        calls:
          - [ setBaseRouteName,       [ 'admin.site.navigation.main' ] ]
          - [ setBaseRoutePattern,    [ 'site-navigation-main' ] ]
          - [ addChildNavigation,     [ '@admin.site.navigation.main.children', 'parent', 'admin.site_admin.site.navigation.main_admin.site.navigation.main.children_list' ] ]
        tags:
          - name: sonata.admin
            model_class: 'App\Entity\Navigation\MainNavigation'
            controller: 'App\Controller\Admin\Site\Navigation\MainNavigationSiteCrudController'
            manager_type: orm
            group: MENU_GROUP.SITE
            label:  MENU.SITE_NAVIGATION_MAIN
            show_in_dashboard: false

    admin.site.navigation.main.children:
          class: 'App\Admin\Site\Navigation\ChildrenNavigationSiteAdmin'
          calls:
            - [ setBaseRouteName,       [ 'admin.site.navigation.main.children' ] ]
            - [ setBaseRoutePattern,    [ 'site-navigation-main-children' ] ]
          tags:
            - name: sonata.admin
              model_class: 'App\Entity\Navigation\MainNavigation'
              controller: 'App\Controller\Admin\Site\Navigation\MainNavigationSiteCrudController'
              manager_type: orm
              group: MENU_GROUP.SITE
              label: MENU.SITE_NAVIGATION_CHILDREN
              translation_domain: '%admin_translation_domain%'
              show_in_dashboard: false

    admin.site.banner:
        class: 'App\Admin\Site\SiteBannerAdmin'
        calls:
            - [ setBaseRouteName,       [ 'admin.site.banner' ] ]
            - [ setBaseRoutePattern,    [ 'site-banner' ] ]
        tags:
            - name: sonata.admin
              model_class: 'App\Entity\Banner'
              controller: 'App\Controller\Admin\Site\SiteBannerCrudController'
              manager_type: orm
              group: MENU_GROUP.SITE
              label: MENU.SITE_BANNER
              show_in_dashboard: false



