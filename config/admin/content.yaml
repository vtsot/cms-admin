services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    # show_in_dashboard = false
    # do not display, it used as link entity
    admin.page:
      class: App\Admin\Content\AllPageAdmin
      calls:
        - [ setBaseRouteName,       [ 'admin.all-page' ] ]
        - [ setBaseRoutePattern,    [ 'all-pages' ] ]
      tags:
        - name: sonata.admin
          model_class: 'App\Entity\Page\Page'
          manager_type: orm
          group: MENU_GROUP.CONTENT
          label: MENU.CONTENT.ALL_PAGE
          translation_domain: '%admin_translation_domain%'
          show_in_dashboard: false

    # show_in_dashboard = false
    # do not display, it used as link entity
    admin.article:
      class: App\Admin\Content\AllArticleAdmin
      calls:
        - [ setBaseRouteName,       [ 'admin.all-article' ] ]
        - [ setBaseRoutePattern,    [ 'all-articles' ] ]
      tags:
        - name: sonata.admin
          model_class: 'App\Entity\Page\Article'
          manager_type: orm
          group: MENU_GROUP.CONTENT
          label: MENU.CONTENT.ALL_ARTICLE
          translation_domain: '%admin_translation_domain%'
          show_in_dashboard: false
