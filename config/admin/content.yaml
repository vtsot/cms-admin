services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    # show_in_dashboard = false
    # do not display, it used as link entity
    admin.page:
        class: App\Admin\Page\AllPageAdmin
        calls:
            - [ setBaseRouteName,       [ 'admin.page' ] ]
            - [ setBaseRoutePattern,    [ 'pages' ] ]
        tags:
            -   name: sonata.admin
                model_class: 'App\Entity\Page\AbstractPage'
                manager_type: orm
                group: MENU_GROUP.CONTENT
                label: MENU.CONTENT.ALL_PAGE
#                translation_domain: '%admin_translation_domain%'
                show_in_dashboard: true
