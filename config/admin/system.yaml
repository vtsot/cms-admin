services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    admin.system.log:
        class: 'App\Admin\Log\LogAdmin'
        calls:
            - [ setBaseRouteName,       ['admin.system'] ]
            - [ setBaseRoutePattern,    ['system'] ]
            - [ setModelManager, [ '@sonata.admin.manager.orm' ] ]
        tags:
            -   name: sonata.admin
                model_class: 'App\Entity\Log\Log'
                manager_type: orm
                group: MENU_GROUP.SYSTEM
                label: MENU.SYSTEM_LOG
