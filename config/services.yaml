# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    timezone: '%env(TIMEZONE)%'
    default_locale: 'en_GB'
    # todo: remove admin_translation_domain
    admin_translation_domain: 'admin-messages'
    storage_dir: '%kernel.project_dir%/var/storage'
    storage_cache_dir: '%kernel.project_dir%/var/cache/storage'
    translation_cache_dir: '%kernel.project_dir%/var/cache/translations'

    site_image_storage_dir: '%storage_dir%/images/site'
    site_image_cache_storage_dir: '%storage_cache_dir%/images/site'
    site_no_image_path: '%kernel.project_dir%/assets/images/site-no-image.jpg'

    article_image_storage_dir: '%storage_dir%/images/site'
    article_image_cache_storage_dir: '%storage_cache_dir%/images/site'
    article_no_image_path: '%kernel.project_dir%/assets/images/article-no-image.jpg'

    banner_image_storage_dir: '%storage_dir%/images/banner'
    banner_image_cache_storage_dir: '%storage_cache_dir%/images/banner'
    banner_no_image_path: '%kernel.project_dir%/assets/images/banner-no-image.jpg'


#        string $siteStorageImageDir: '%storage_dir%/images/site'
#        string $siteCacheImageDir: '%storage_cache_dir%/images/site/'

#        string $bannerCacheImageDir: '%storage_cache_dir%/images/banner/'
#        string $bannerNoImagePath: '%kernel.project_dir%/assets/images/banner-no-image.jpg'


imports:
    - { resource: admin.yaml }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Contract\Entity\EntityListenerInterface:
            tags:
                - { name: doctrine.orm.entity_listener, lazy: true }

        App\Contract\MessageHandler\CommandHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: command.bus }

        App\Contract\MessageHandler\QueryHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: query.bus }

        App\Contract\MessageHandler\EventHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: event.bus }

        App\Contract\CmsEmbed\CmsEmbedInterface:
            tags:
                - { name: app.cms_embed }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/ApiRequest/'
            - '../src/Contract/'
            - '../src/DTO/'
            - '../src/Entity/'
            - '../src/Exception/'
            - '../src/CQ/**/*Query.php'
            - '../src/CQ/**/*Command.php'
            - '../src/CQ/**/*Event.php'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Sonata\GoogleAuthenticator\GoogleAuthenticator:
        class: Sonata\GoogleAuthenticator\GoogleAuthenticator

#    html_sanitizer.config.cms_embed_sanitizer:
#        class: App\Service\CmsEmbed\Helper\CmsEmbedHtmlSanitizerConfig
#        calls:
#            - allowStaticElements: !returns_clone [ ]
#            - withMaxInputLength: !returns_clone [ 65535 ]
#            - allowCmsEmbedItems: !returns_clone [ !tagged_iterator 'app.cms_embed' ]

    mailer.messenger.message_handler:
        class: App\CQ\Command\Mailer\SendEmailMessageHandler
        tags:
            - { name: messenger.message_handler, bus: command.bus }

    App\Service\UploaderUuidNamer:
        public: true

    Intervention\Image\ImageManager:
        factory: ['App\Service\Factory\ImageManagerFactory', 'create']
